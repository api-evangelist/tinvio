name: Tinvio
description: 'Tinvio is a Singapore-based B2B commerce and payments SaaS that helped merchants
  and their suppliers manage ordering, invoicing, and business payments across Southeast Asia. The
  company was backed by Partech. As of 2026 Tinvio has been integrated into Jaz (jaz.ai), an
  AI-powered accounting platform for modern businesses, and now operates as a feature within Jaz
  rather than as a standalone product; tinvio.com redirects to the Jaz landing page. Tinvio does
  not currently publish a public developer portal, API reference, SDK, CLI, or OpenAPI definition,
  so this profile captures the company identity and its live domain-security posture for the API
  Evangelist network rather than an API surface.'
